name: Xcode Simulator Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build FrameForgeAI for iOS Simulator
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Show project schemes
        run: xcodebuild -project FrameForgeAI.xcodeproj -list

      - name: Build Debug for simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project FrameForgeAI.xcodeproj \
            -scheme FrameForgeAI \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            clean build
