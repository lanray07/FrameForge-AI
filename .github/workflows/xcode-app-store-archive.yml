name: Xcode App Store Archive

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/xcode-app-store-archive.yml"
  workflow_dispatch:
    inputs:
      marketing_version:
        description: App Store version number
        required: true
        default: "1.0"
      upload_to_app_store_connect:
        description: Upload exported IPA to App Store Connect
        required: true
        type: boolean
        default: false

env:
  PROJECT_PATH: FrameForgeAI.xcodeproj
  SCHEME: FrameForgeAI
  CONFIGURATION: Release
  BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.frameforge.ai' }}

jobs:
  archive:
    name: Archive signed iOS app
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Prepare App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${APP_STORE_CONNECT_API_KEY_ID:-}" ]; then
            echo "::error::APP_STORE_CONNECT_API_KEY_ID is required for automatic signing."
            exit 1
          fi

          PRIVATE_KEYS_DIR="$RUNNER_TEMP/private_keys"
          KEY_PATH="$PRIVATE_KEYS_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          mkdir -p "$PRIVATE_KEYS_DIR"

          if [ -n "${APP_STORE_CONNECT_API_KEY_BASE64:-}" ]; then
            printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 -D > "$KEY_PATH"
          elif [ -n "${APP_STORE_CONNECT_API_PRIVATE_KEY:-}" ]; then
            if printf '%s' "$APP_STORE_CONNECT_API_PRIVATE_KEY" | grep -q "BEGIN PRIVATE KEY"; then
              printf '%s' "$APP_STORE_CONNECT_API_PRIVATE_KEY" | python3 -c 'import sys; sys.stdout.write(sys.stdin.read().replace("\\n", "\n"))' > "$KEY_PATH"
            else
              printf '%s' "$APP_STORE_CONNECT_API_PRIVATE_KEY" | base64 -D > "$KEY_PATH"
            fi
          else
            echo "::error::APP_STORE_CONNECT_API_PRIVATE_KEY or APP_STORE_CONNECT_API_KEY_BASE64 is required."
            exit 1
          fi

          chmod 600 "$KEY_PATH"
          {
            echo "ASC_PRIVATE_KEYS_DIR=$PRIVATE_KEYS_DIR"
            echo "ASC_API_KEY_PATH=$KEY_PATH"
          } >> "$GITHUB_ENV"

      - name: Validate signing and upload secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          for name in APPLE_TEAM_ID APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_ISSUER_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required for a signed App Store archive and upload."
              exit 1
            fi
          done
          if [ ! -s "${ASC_API_KEY_PATH:-}" ]; then
            echo "::error::The App Store Connect API key file was not created."
            exit 1
          fi

      - name: Archive app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          MARKETING_VERSION: ${{ inputs.marketing_version || '1.0' }}
        run: |
          set -o pipefail
          ARCHIVE_PATH="$RUNNER_TEMP/FrameForgeAI.xcarchive"
          xcodebuild \
            -project "$PROJECT_PATH" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            clean archive
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"

      - name: Export IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          EXPORT_PATH="$RUNNER_TEMP/export"
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$EXPORT_OPTIONS" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_API_KEY_PATH" \
            -authenticationKeyID "$APP_STORE_CONNECT_API_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_API_ISSUER_ID"
          IPA_PATH="$(find "$EXPORT_PATH" -name '*.ipa' -print -quit)"
          if [ -z "$IPA_PATH" ]; then
            echo "::error::No IPA was exported."
            exit 1
          fi
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FrameForgeAI-${{ github.run_number }}.ipa
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error

      - name: Validate App Store Connect upload secrets
        if: ${{ github.event_name == 'push' || inputs.upload_to_app_store_connect }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          for name in APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_ISSUER_ID ASC_PRIVATE_KEYS_DIR; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is required when upload_to_app_store_connect is true."
              exit 1
            fi
          done

      - name: Upload IPA to App Store Connect
        if: ${{ github.event_name == 'push' || inputs.upload_to_app_store_connect }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          API_PRIVATE_KEYS_DIR="$ASC_PRIVATE_KEYS_DIR" xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"

      - name: Clean signing keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
